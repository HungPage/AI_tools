app:
  name: Amazon 熱銷分類
  mode: workflow
  icon: 🛒
  icon_background: '#DFF0F1'
  description: Apify 熱銷榜 → LLM 分類 → Google 試算表
  use_icon_as_answer_icon: false
kind: app
version: 0.3.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables:
  - id: 6c8b9ed0-49d2-599d-8970-9307a9d344ec
    name: APIFY_TOKEN
    value: ''
    value_type: secret
