    - APIFY_TOKEN
  - id: df9b4559-655c-5762-ab0d-4cd82a9ee286
    name: SHEET_URL
    value: ''
    value_type: string
    description: Apps Script 網頁應用程式網址（結尾 /exec）
    selector:
    - env
    - SHEET_URL
  - id: 75997633-c521-55f8-8c80-a82ca8197030
    name: SHEET_TOKEN
    value: ''
    value_type: secret
    description: Apps Script 第 2 行的 TOKEN
    selector:
    - env
    - SHEET_TOKEN
